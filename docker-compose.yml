version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: pharmacy_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - pharmacy_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmacy_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/pharmacy_db
      JWT_SECRET: super-secret-key-change-in-production
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - pharmacy_network
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pharmacy_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - pharmacy_network
    volumes:
      - ./frontend/src:/app/src

volumes:
  mongodb_data:

networks:
  pharmacy_network:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# Config Nginx pour PharmaConnect sur un VPS Hostinger
# Remplace TON-DOMAINE.com par ton vrai nom de domaine partout.
# Place ce fichier dans /etc/nginx/sites-available/pharmaconnect
# puis : ln -s /etc/nginx/sites-available/pharmaconnect /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name TON-DOMAINE.com www.TON-DOMAINE.com;

    # Frontend React (build statique)
    root /var/www/pharmaconnect/frontend/dist;
    index index.html;

    client_max_body_size 15M;  # ordonnances/photos jusqu'à 10 Mo + marge

    # API REST NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers uploadés (ordonnances, photos médicaments)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
    }

    # WebSocket (Socket.io) — chat ET suivi de livraison passent tous les deux ici
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;  # garde la connexion WS ouverte
    }

    # Frontend SPA — tout le reste sert index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
